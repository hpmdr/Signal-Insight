name: Release

# 自动发布：推送 v* tag 即触发构建并创建 GitHub Release。
#
# ── 签名密钥（重要，勿改）──
# 线上发布使用 GitHub Secrets 中的密钥签名，其证书指纹为：
#     6C:1D:3F:27:19:AD:78:8C:80:C3:63:E3:E3:AD:49:C3:11:5A:A5:F4:0A:18:27:7A:7A:24:3D:36:80:6B:27:E2
# 该指纹自 v1.0.0 起从未变更（v1.0.0 ~ v1.1.0 八个版本实测完全一致），
# 因此用户升级始终可正常覆盖安装。
#
# ⚠️ 注意：本地 private-release.jks 是**另一把**密钥（指纹 B9:8A:E3:A9:…:D4:4F），
# 用它签出的包与线上签名不匹配。**正式分发一律走本 workflow（CI 构建）**，
# 不要用本地 assembleRelease 的产物对外分发。详见 doc/签名密钥与分发规范.md。
#
# GitHub Secrets 必须保持的四项（请勿删除或修改）：
#   SIGNING_KEY / KEY_STORE_PASSWORD / KEY_PASSWORD / KEY_ALIAS
# 注意 Secrets 是「一次性配置、长期保存」的凭据，不是每次打 tag 上传的产物；
# 且它只写不读、无法导出——线上密钥没有文件备份，删除后即永久失去。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史以生成发布说明

      - name: 获取所有 tags
        run: git fetch --tags --force

      - name: 生成发布说明
        run: |
          TAG="${{ github.ref_name }}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -A1 "^$TAG$" | tail -1)
          echo "## $TAG" > release_notes.md
          echo "" >> release_notes.md
          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$TAG" ]; then
            echo "**范围:** $PREV_TAG → $TAG" >> release_notes.md
            echo "" >> release_notes.md
            git log --pretty=format:"- %s" "$PREV_TAG..HEAD" >> release_notes.md
          else
            git log --pretty=format:"- %s" >> release_notes.md
          fi

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: microsoft

      # 不需要 setup-android。
      #
      # GitHub 官方 ubuntu-latest runner 镜像已预装本项目所需的全部组件
      # （依据 actions/runner-images 的 Ubuntu2404-Readme.md）:
      #   Android SDK Platforms : android-37.2 (rev 1)   ← 本项目 compileSdk 所需
      #   Android SDK Build-tools: 37.0.0                ← 本项目 buildToolsVersion 所需
      #   ANDROID_HOME / ANDROID_SDK_ROOT = /usr/local/lib/android/sdk
      #
      # 而 setup-android@v3 会去改动预装 SDK，在 CI 运行 #20/#21 中于该步骤失败:
      #   The process '/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager'
      #   failed with exit code 1
      # 导致后续「解码签名密钥 / 构建并签名 / 创建 Release」全部被跳过。
      # 该 action 在 2026-07-09 的 #19（v1.0.7）尚可成功，说明是 runner 镜像
      # 在这 84 天内更新后与 action 不再兼容，并非项目配置问题。
      #
      # 因此这里只做校验，不改动环境；缺失时才用新 CLI 补齐。
      - name: 校验 Android SDK 组件
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "--- 必需的组件 ---"
          ls -d "$ANDROID_SDK_ROOT/platforms/android-37.2" "$ANDROID_SDK_ROOT/build-tools/37.0.0"
          # 兜底: 仅当预装缺失时才安装。
          # 注意 sdkmanager 已被官方弃用，替代品是 cmdline-tools/bin 下的 `android` 命令。
          if [ ! -d "$ANDROID_SDK_ROOT/platforms/android-37.2" ]; then
            echo "android-37.2 缺失，使用 android CLI 补齐"
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/android" sdk install \
              "platforms;android-37.2" "build-tools;37.0.0" || \
            "$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/android | head -1)" sdk install \
              "platforms;android-37.2" "build-tools;37.0.0"
          fi

      - name: 设置 gradlew 执行权限
        run: chmod +x gradlew

      # 从 GitHub Secrets 恢复签名密钥和配置
      # Gradle 构建时自动读取 keystore.properties → 签名 Release APK
      - name: 解码签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEY }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release.jks

      - name: 写入签名配置
        run: |
          echo "storePassword=${{ secrets.KEY_STORE_PASSWORD }}" > keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
          echo "storeFile=release.jks" >> keystore.properties

      # 构建已签名的 Release APK（gradle 自动使用 keystore.properties 签名）
      - name: 构建并签名 Release APK
        run: ./gradlew assembleRelease

      # 使用从 git log 生成的发布说明创建 GitHub Release
      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: SignalInsight ${{ github.ref_name }}
          body_path: release_notes.md
          files: app/build/outputs/apk/release/*.apk
