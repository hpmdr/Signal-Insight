name: Release

# 自动发布已恢复：推送 v* tag 即触发构建并创建 GitHub Release。
#
# 签名密钥变更说明（v1.1.0 起）：
#   v1.0.0 ~ v1.0.7 使用的密钥库文件已丢失（证书指纹 6C:1D:3F:27:…:27:E2），
#   v1.1.0 起改用新密钥库（证书指纹 B9:8A:E3:A9:…:D4:4F，别名 release）。
#   已安装 v1.0.x 的用户需卸载重装，详见 doc/v1.1.0-发版说明.md。
#
# 发版前请确认 GitHub Secrets 已更新为新密钥对应的值：
#   SIGNING_KEY / KEY_STORE_PASSWORD / KEY_PASSWORD / KEY_ALIAS(=release)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史以生成发布说明

      - name: 获取所有 tags
        run: git fetch --tags --force

      - name: 生成发布说明
        run: |
          TAG="${{ github.ref_name }}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -A1 "^$TAG$" | tail -1)
          echo "## $TAG" > release_notes.md
          echo "" >> release_notes.md
          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$TAG" ]; then
            echo "**范围:** $PREV_TAG → $TAG" >> release_notes.md
            echo "" >> release_notes.md
            git log --pretty=format:"- %s" "$PREV_TAG..HEAD" >> release_notes.md
          else
            git log --pretty=format:"- %s" >> release_notes.md
          fi

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: microsoft

      # 安装项目所需 SDK 组件。
      #
      # 背景: 本项目 compileSdk 为 37.2（Android 17 的 minor API level），
      # setup-android 默认只装 "tools platform-tools"，不含 37.2，
      # 其内部自动补齐时失败并导致整步报错（CI 运行 #20:
      # "sdkmanager failed with exit code 1"），后续签名与构建步骤全被跳过。
      #
      # 优先使用 action 自带的 packages 输入（由 action 内部调用 SDK 工具，最稳妥）。
      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools "platforms;android-37.2" "build-tools;37.0.0"'

      # 兜底: 若上面未装上，改用新的 Android CLI 补齐。
      # 注意 sdkmanager 已被官方弃用（运行时提示 "The SDK Manager CLI tool (sdkmanager)
      # is deprecated. Android CLI will be used instead."），替代品是 cmdline-tools/bin 下的
      # `android` 命令；该目录已由 setup-android 加入 PATH（action.yml 描述即为
      # "Setup the Android SDK Tools and add them to the path"）。
      # 已在本地干净 SDK 目录实测 `android sdk install` 可正确安装这两个包。
      - name: 校验并补齐 SDK 组件
        run: |
          if [ ! -d "$ANDROID_SDK_ROOT/platforms/android-37.2" ]; then
            echo "android-37.2 未安装，使用 android CLI 补齐"
            android sdk install "platforms;android-37.2" "build-tools;37.0.0" "platform-tools"
          fi
          echo "--- 已安装组件 ---"
          android sdk list | grep -E "platforms;android-37|build-tools;37" || true
          echo "--- 目录校验 ---"
          ls -d "$ANDROID_SDK_ROOT/platforms/android-37.2" "$ANDROID_SDK_ROOT/build-tools/37.0.0"

      - name: 设置 gradlew 执行权限
        run: chmod +x gradlew

      # 从 GitHub Secrets 恢复签名密钥和配置
      # Gradle 构建时自动读取 keystore.properties → 签名 Release APK
      - name: 解码签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEY }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release.jks

      - name: 写入签名配置
        run: |
          echo "storePassword=${{ secrets.KEY_STORE_PASSWORD }}" > keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
          echo "storeFile=release.jks" >> keystore.properties

      # 构建已签名的 Release APK（gradle 自动使用 keystore.properties 签名）
      - name: 构建并签名 Release APK
        run: ./gradlew assembleRelease

      # 使用从 git log 生成的发布说明创建 GitHub Release
      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: SignalInsight ${{ github.ref_name }}
          body_path: release_notes.md
          files: app/build/outputs/apk/release/*.apk
